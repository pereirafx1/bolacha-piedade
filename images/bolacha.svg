<svg viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D878"/>
      <stop offset="50%" stop-color="#E2C050"/>
      <stop offset="100%" stop-color="#C8A030"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E898" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E2C050" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="82" cy="122" rx="68" ry="7" fill="rgba(0,0,0,0.18)" filter="blur(4px)"/>

  <!-- Main body -->
  <rect x="6" y="4" width="148" height="112" rx="10" fill="url(#bg)"/>

  <!-- Grain texture overlay -->
  <rect x="6" y="4" width="148" height="112" rx="10" fill="url(#bg)" filter="url(#grain)" opacity="0.3"/>

  <!-- Top shine -->
  <rect x="6" y="4" width="148" height="112" rx="10" fill="url(#top)" opacity="0.5"/>

  <!-- Darker border/edge -->
  <rect x="6" y="4" width="148" height="112" rx="10" fill="none" stroke="#A87820" stroke-width="2.5" opacity="0.6"/>

  <!-- Inner score line border -->
  <rect x="14" y="12" width="132" height="96" rx="7" fill="none" stroke="#C8A030" stroke-width="1" opacity="0.5"/>

  <!-- Surface bumps (seed texture) -->
  <!-- Row 1 -->
  <ellipse cx="32"  cy="26" rx="3"   ry="1.5" fill="#7A5810" opacity="0.75" transform="rotate(-25 32 26)"/>
  <ellipse cx="55"  cy="20" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.65" transform="rotate(15 55 20)"/>
  <ellipse cx="78"  cy="28" rx="3"   ry="1.4" fill="#7A5810" opacity="0.70" transform="rotate(-40 78 28)"/>
  <ellipse cx="105" cy="22" rx="2.5" ry="1.3" fill="#6B4C0A" opacity="0.65" transform="rotate(20 105 22)"/>
  <ellipse cx="130" cy="30" rx="3"   ry="1.5" fill="#7A5810" opacity="0.72" transform="rotate(-15 130 30)"/>

  <!-- Row 2 -->
  <ellipse cx="22"  cy="45" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.60" transform="rotate(35 22 45)"/>
  <ellipse cx="44"  cy="50" rx="3"   ry="1.5" fill="#7A5810" opacity="0.75" transform="rotate(-30 44 50)"/>
  <ellipse cx="68"  cy="42" rx="2.5" ry="1.3" fill="#6B4C0A" opacity="0.65" transform="rotate(10 68 42)"/>
  <ellipse cx="92"  cy="52" rx="3"   ry="1.4" fill="#7A5810" opacity="0.70" transform="rotate(-45 92 52)"/>
  <ellipse cx="118" cy="44" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.62" transform="rotate(25 118 44)"/>
  <ellipse cx="142" cy="50" rx="3"   ry="1.5" fill="#7A5810" opacity="0.70" transform="rotate(-20 142 50)"/>

  <!-- Row 3 -->
  <ellipse cx="30"  cy="66" rx="3"   ry="1.5" fill="#7A5810" opacity="0.72" transform="rotate(40 30 66)"/>
  <ellipse cx="58"  cy="70" rx="2.5" ry="1.3" fill="#6B4C0A" opacity="0.65" transform="rotate(-15 58 70)"/>
  <ellipse cx="82"  cy="63" rx="3"   ry="1.4" fill="#7A5810" opacity="0.75" transform="rotate(30 82 63)"/>
  <ellipse cx="110" cy="68" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.62" transform="rotate(-35 110 68)"/>
  <ellipse cx="135" cy="63" rx="3"   ry="1.5" fill="#7A5810" opacity="0.70" transform="rotate(12 135 63)"/>

  <!-- Row 4 -->
  <ellipse cx="20"  cy="86" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.60" transform="rotate(-20 20 86)"/>
  <ellipse cx="46"  cy="90" rx="3"   ry="1.5" fill="#7A5810" opacity="0.73" transform="rotate(38 46 90)"/>
  <ellipse cx="72"  cy="84" rx="2.5" ry="1.3" fill="#6B4C0A" opacity="0.65" transform="rotate(-10 72 84)"/>
  <ellipse cx="97"  cy="92" rx="3"   ry="1.4" fill="#7A5810" opacity="0.70" transform="rotate(22 97 92)"/>
  <ellipse cx="122" cy="86" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.62" transform="rotate(-42 122 86)"/>
  <ellipse cx="146" cy="90" rx="3"   ry="1.5" fill="#7A5810" opacity="0.68" transform="rotate(18 146 90)"/>

  <!-- Row 5 -->
  <ellipse cx="36"  cy="106" rx="3"   ry="1.5" fill="#7A5810" opacity="0.70" transform="rotate(-28 36 106)"/>
  <ellipse cx="62"  cy="102" rx="2.5" ry="1.3" fill="#6B4C0A" opacity="0.63" transform="rotate(15 62 102)"/>
  <ellipse cx="88"  cy="108" rx="3"   ry="1.4" fill="#7A5810" opacity="0.72" transform="rotate(-38 88 108)"/>
  <ellipse cx="114" cy="103" rx="2.5" ry="1.2" fill="#6B4C0A" opacity="0.60" transform="rotate(30 114 103)"/>
  <ellipse cx="138" cy="106" rx="3"   ry="1.5" fill="#7A5810" opacity="0.68" transform="rotate(-12 138 106)"/>

  <!-- Edge bake marks (darker corners) -->
  <rect x="6" y="4" width="148" height="112" rx="10" fill="none" stroke="#7A5010" stroke-width="6" opacity="0.12"/>
</svg>
